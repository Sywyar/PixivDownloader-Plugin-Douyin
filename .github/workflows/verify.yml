name: Verify plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin@sha256:fb9701fe3592f88a6158bdea97ee25821fcf1dd8837b08ced2c027ddebad4a34
      options: --cpus=2 --memory=6g --pids-limit=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
      - name: Build and test
        run: |
          umask 022
          sh ./mvnw -B -ntp clean verify
      - name: Check offline reproduction
        run: |
          umask 022
          sha256sum target/pixivdownload-plugin-*.jar > "$RUNNER_TEMP/plugin.sha256"
          sh ./mvnw -B -ntp -o clean verify
          sha256sum --check "$RUNNER_TEMP/plugin.sha256"
          cp "$RUNNER_TEMP/plugin.sha256" target/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: douyin-candidate
          if-no-files-found: error
          path: |
            target/pixivdownload-plugin-*.jar
            target/SHA256SUMS
